# Only run the Azure Linux Agent when the VM is actually on Azure.
#
# Off-Azure (eryph / generic Hyper-V / KVM) cloud-init does all provisioning,
# so the agent has no work to do — it just retries the Azure wireserver
# (168.63.129.16) forever. We gate startup on the Azure DMI chassis asset tag;
# generic Hyper-V leaves it empty, Azure sets the fixed value below. This is the
# same signal cloud-init's Azure datasource uses.
#
# ExecCondition exits the unit silently (no "failed" state) when the tag does
# not match. It needs systemd >= 243 (all supported Ubuntu, AlmaLinux 9/10).
# On AlmaLinux 8 (systemd 239) the directive is ignored and the agent starts as
# before — Logs.Console=n in waagent.conf keeps the console quiet there.
[Service]
ExecCondition=/bin/sh -c 'test "$(cat /sys/class/dmi/id/chassis_asset_tag 2>/dev/null)" = "7783-7084-3265-9085-8269-3286-77"'
