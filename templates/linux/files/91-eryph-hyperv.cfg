datasource_list: [ NoCloud, Azure, None ]
# Enable SSH password auth by default. The upstream cloud images ship it
# disabled (Ubuntu: 60-cloudimg-settings.conf; AlmaLinux: baked
# ssh_pwauth: false + a PasswordAuthentication no line in sshd_config).
# Setting it here lets cloud-init write 50-cloud-init.conf=yes, which wins
# over those defaults — while a user's fodder (user-data) still overrides
# this, so `ssh_pwauth: false` keeps working for hardening.
ssh_pwauth: true
datasource:
  Azure:
    apply_network_config: false
    data_dir: /var/lib/waagent
